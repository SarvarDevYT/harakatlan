<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B0B0B; color: #F5F5F2; font-family: Inter, sans-serif; position: relative; overflow: hidden;">

      </text>
    </svg>

  <div style="position: relative; padding: 0 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; color: #A3A39D;">Qadamlar</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700;">7 180</span>
      </div>
      <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; color: #A3A39D;">Vaqt</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700;">1:12</span>
      </div>
      <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 4px;">
        <span style="font-size: 12px; color: #A3A39D;">Kuch</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; color: #D4FF3F;">+5</span>
      </div>
    </div>

    <div style="position: relative; background: #D4FF3F; color: #0B0B0B; border-radius: 30px; padding: 20px; height: 168px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;">
      <div style="position: absolute; right: -6px; top: 10px; width: 150px; height: 120px;" aria-hidden="true">
        <sc-for list="{{mini}}" as="h" hint-placeholder-count="7">
          <div style="{{h.side}}"></div>
          <div style="{{h.top}}">
            <sc-if value="{{h.castle}}" hint-placeholder-val="{{false}}">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2.2" stroke-linejoin="round"><path d="M4 21V9h3V6h3v3h4V6h3v3h3v12z"></path></svg>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 190px;">
        <span style="font-family: Caveat, cursive; font-size: 24px; font-weight: 700; line-height: 1;">qal'ang o'smoqda</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; line-height: 1.1;">5 ta yangi katak tayyor</span>
      </div>
      <a href="Territory.dc.html" style="align-self: flex-start; height: 48px; padding: 0 8px 0 20px; border-radius: 999px; background: #0B0B0B; color: #D4FF3F; display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 600; font-size: 15px;">Hududni qurish
        <span style="width: 34px; height: 34px; border-radius: 999px; background: #D4FF3F; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
        </span>

    </div>
  </div>

  <nav style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 68px; border-radius: 999px; background: rgba(27,27,27,0.92); border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 8px;" aria-label="Asosiy menyu">
    <a href="Home.dc.html" style="height: 52px; padding: 0 18px; border-radius: 999px; background: #D4FF3F; color: #0B0B0B; display: flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: 14px;">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var ticks = [];
    for (var i = 0; i < 22; i++) {
      ticks.push({ style: 'width:4px;border-radius:2px;height:' + (i < 14 ? 16 : 12) + 'px;background:' + (i < 14 ? '#D4FF3F' : '#3A3A38') });
    }
    var clip = 'clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);';
    var cells = [[1, 0, 'o'], [2, 0, 'o'], [0, 1, 'o'], [1, 1, 'O'], [2, 1, 'o'], [1, 2, 'o'], [2, 2, 'n']];
    var mini = cells.map(function (c) {
      var castle = c[2] === 'O';
      var x = c[0] * 40 + (c[1] % 2 ? 20 : 0);
      var y = c[1] * 33 - (castle ? 8 : 0);
      var top = c[2] === 'n' ? 'rgba(11,11,11,0.18)' : (castle ? '#F5F5F2' : '#0B0B0B');
      var side = c[2] === 'n' ? 'transparent' : (castle ? '#3A3A38' : '#5E7716');
      var d = c[2] === 'n' ? 0 : (castle ? 14 : 7);
      return {
        castle: castle,
        side: 'position:absolute;left:' + x + 'px;top:' + (y + d) + 'px;width:38px;height:44px;' + clip + 'background:' + side,
        top: 'position:absolute;left:' + x + 'px;top:' + y + 'px;width:38px;height:44px;display:flex;align-items:center;justify-content:center;' + clip + 'background:' + top
      };
    });
    return { ticks: ticks, mini: mini, false: false };
  }
}
</script>
