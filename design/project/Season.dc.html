    <span style="font-size: 13px; color: #C9C9C4;">Qal'a Lv 4 · 340 / 500 RP</span>
  </div>
  <div style="position: relative; height: 12px; border-radius: 999px; background: #222;" role="img" aria-label="Platinagacha 68 foiz">
    <div style="width: 68%; height: 12px; border-radius: 999px; background: linear-gradient(90deg, #C9961E, #FFE68A); box-shadow: 0 0 16px rgba(242,201,76,0.5);"></div>
  </div>

  <div style="position: relative; display: flex; justify-content: space-between; align-items: flex-end;">
    <sc-for list="{{tiers}}" as="t" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 52px;">
        <div style="{{t.badge}}">

        <span style="{{t.label}}">{{t.name}}</span>
      </div>
    </sc-for>
  </div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; margin-top: 2px;">
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 17px; font-weight: 700;">Mavsum sovg'alari</span>
    <span style="font-size: 13px; color: #A3A39D;">qal'a va profil uchun</span>
  </div>
  <div style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; gap: 10px; align-items: center;">
        <div style="width: 46px; height: 52px; flex-shrink: 0; background: #D4FF3F; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); display: flex; align-items: center; justify-content: center;" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2" stroke-linejoin="round"><path d="M4 21V9h3V6h3v3h4V6h3v3h3v12z"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; min-width: 0;">
          <span style="font-weight: 600; font-size: 14px;">Neon minora</span>
          <span style="font-size: 12px; color: #A3A39D;">Qal'a skini</span>
        </div>
      </div>
      <span style="height: 30px; border-radius: 999px; background: rgba(212,255,63,0.12); color: #D4FF3F; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 600;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D4FF3F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Olingan
      </span>
    </div>
    <div style="background: rgba(242,201,76,0.08); border: 1px solid rgba(242,201,76,0.4); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; gap: 10px; align-items: center;">
        <span style="width: 44px; height: 44px; margin: 4px 1px; flex-shrink: 0; border-radius: 999px; background: #D4FF3F; color: #0B0B0B; display: flex; align-items: center; justify-content: center; font-weight: 700; box-shadow: 0 0 0 3px #0B0B0B, 0 0 0 6px #F2C94C, 0 0 18px rgba(242,201,76,0.6);" aria-hidden="true">J</span>
        <div style="display: flex; flex-direction: column; min-width: 0;">
          <span style="font-weight: 600; font-size: 14px;">Oltin halqa</span>
          <span style="font-size: 12px; color: #A3A39D;">Avatar ramkasi</span>
        </div>
      </div>
      <button style="height: 30px; border: none; border-radius: 999px; background: #F2C94C; color: #0B0B0B; font-family: Inter, sans-serif; font-size: 13px; font-weight: 700;">Olish</button>
    </div>
    <div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 22px; padding: 12px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; gap: 10px; align-items: center;">
        <span style="width: 46px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: 0.55;" aria-hidden="true">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7FE3D6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h13l-3 4.5L18 13H5"></path><path d="M12 5.5l-2 3.5h3l-2 3"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; min-width: 0;">

          <span style="font-size: 12px; color: #A3A39D;">Hudud bayrog'i</span>
        </div>
      </div>
      <span style="height: 30px; border-radius: 999px; background: #1B1B1B; color: #A3A39D; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A3A39D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Platinada

      <div style="display: flex; gap: 10px; align-items: center;">
        <span style="width: 46px; height: 52px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: 0.55;" aria-hidden="true">
          <svg width="40" height="30" viewBox="0 0 40 30" fill="none" stroke-linecap="round"><path d="M2 24 C 10 4, 18 28, 26 12 S 36 4, 38 8" stroke="#FF8A3D" stroke-width="4"></path><path d="M2 24 C 10 4, 18 28, 26 12" stroke="#FFD23D" stroke-width="1.5"></path></svg>
        </span>
        <div style="display: flex; flex-direction: column; min-width: 0;">
          <span style="font-weight: 600; font-size: 14px;">Olov izi</span>
          <span style="font-size: 12px; color: #A3A39D;">Xarita effekti</span>
        </div>
      </div>
      <span style="height: 30px; border-radius: 999px; background: #1B1B1B; color: #A3A39D; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A3A39D" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Afsonada

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var clip = 'clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);';
    var list = [
      ['Bronza', '#C98A5A', 'done'],
      ['Kumush', '#C9CED6', 'done'],
      ['Oltin', '#F2C94C', 'now'],
      ['Platina', '#7FE3D6', 'lock'],
      ['Olmos', '#8FB8FF', 'lock'],
      ['Afsona', '#D4FF3F', 'lock']
    ];
    var tiers = list.map(function (t) {
      var now = t[2] === 'now';
      var size = now ? 'width:44px;height:50px;' : 'width:34px;height:39px;';
      var op = t[2] === 'lock' ? 'opacity:0.4;' : '';
      return {
        name: t[0],
        locked: t[2] === 'lock',
        badge: size + clip + op + 'background:' + t[1] + ';display:flex;align-items:center;justify-content:center;' + (now ? 'filter:drop-shadow(0 0 10px rgba(242,201,76,0.8));' : ''),
        label: 'font-size:11px;' + (now ? 'color:#F2C94C;font-weight:700;' : 'color:#A3A39D;')
      };
    });
    return { tiers: tiers, false: false };
  }
}
</script>
</body>
</html>
