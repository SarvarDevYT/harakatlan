      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 32px; font-weight: 700; line-height: 1;">9</span>
      <span style="font-size: 13px; color: #A3A39D;">Bosib olingan</span>

      </div>
    </div>
    <a href="Map.dc.html" style="height: 46px; border-radius: 999px; border: 1px solid #D4FF3F; color: #D4FF3F; display: flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 600; font-size: 15px;">Ertaga qaytarib olish</a>

  <nav style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 68px; border-radius: 999px; background: #1B1B1B; display: flex; align-items: center; justify-content: space-between; padding: 0 8px;" aria-label="Asosiy menyu">

    </a>
    <a href="Profile.dc.html" aria-label="Reyting" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center;">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var data = [['Du', 4.1], ['Se', 5.2], ['Ch', 3.0], ['Pa', 6.4], ['Ju', 2.2], ['Sh', 7.8], ['Ya', 5.2]];
    var bars = data.map(function (x, i) {
      var h = Math.round(x[1] / 7.8 * 76);
      var bg = i === data.length - 1 ? '#D4FF3F' : '#3A3A38';
      return { d: x[0], style: 'width:100%;height:' + h + 'px;border-radius:8px;background:' + bg };
    });
    return { bars: bars };
  }
}
</script>
