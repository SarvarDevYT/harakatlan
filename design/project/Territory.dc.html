<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // one string per row; o own land, F conquered with flag, c conquered, n new tile,
    // g grass, w water, T tree, P pine, O castle, ~ nothing
    var rows = [
      '~~gcF~~',
      '~goooc~',
      'Pooooon',
      'gooOoog',
      'nooooT~',
      '~gooFg~',
      '~~gwg~~'
    ];
    var TW = 64, TH = 32, OX = 163, OY = 92, DEPTH = 11;
    var P = {
      g: ['#86CF62', '#7AC458', '#4E8F36'],
      w: ['#5CC1F0', '#52B6E8', '#2E86B8'],
      o: ['#C8F05A', '#BEE84E', '#7A9E22']
    };
    var base = { T: 'g', P: 'g', O: 'o', F: 'c' };
    var kind = { T: 'tree', P: 'pine', O: 'castle', F: 'flag', n: 'plus' };
    var size = { tree: [38, 48], pine: [34, 54], castle: [100, 112], flag: [26, 40], plus: [28, 28] };
    var diamond = 'clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);';
    var cells = [];
    rows.forEach(function (row, r) {
      for (var c = 0; c < row.length; c++) {
        if (row.charAt(c) !== '~') cells.push({ r: r, c: c, ch: row.charAt(c) });
      }
    });
    cells.sort(function (p, q) { return (p.r + p.c) - (q.r + q.c) || p.c - q.c; });
    var tiles = [], objects = [];
    cells.forEach(function (cell) {
      var t = base[cell.ch] || cell.ch;
      var x = (cell.c - cell.r) * TW / 2 + OX;
      var y = (cell.c + cell.r) * TH / 2 + OY;
      var alt = (cell.r + cell.c) % 2;
      var top, side;
      if (t === 'c') { top = 'repeating-linear-gradient(135deg,#C8F05A 0 7px,#A9D63A 7px 14px)'; side = '#7A9E22'; }
      else if (t === 'n') { top = 'rgba(212,255,63,0.22)'; side = 'rgba(212,255,63,0.10)'; }
      else { top = P[t][alt]; side = P[t][2]; }
      tiles.push({
        side: 'position:absolute;left:' + x + 'px;top:' + (y + DEPTH) + 'px;width:' + TW + 'px;height:' + TH + 'px;' + diamond + 'background:' + side,
        top: 'position:absolute;left:' + x + 'px;top:' + (y + (t === 'w' ? 4 : 0)) + 'px;width:' + TW + 'px;height:' + TH + 'px;' + diamond + 'background:' + top
      });
      var k = kind[cell.ch];
      if (k) {
        var s = size[k], cx = x + TW / 2, cy = y + TH / 2;
        var topY = k === 'plus' ? cy - s[1] / 2 - 4 : cy - s[1] + 6;
        objects.push({
          isTree: k === 'tree', isPine: k === 'pine', isFlag: k === 'flag', isPlus: k === 'plus', isCastle: k === 'castle',
          w: s[0], h: s[1],
          style: 'position:absolute;left:' + (cx - s[0] / 2) + 'px;top:' + topY + 'px;width:' + s[0] + 'px;height:' + s[1] + 'px;'
        });
      }
    });
    return { tiles: tiles, objects: objects, false: false };
  }
}
</script>
